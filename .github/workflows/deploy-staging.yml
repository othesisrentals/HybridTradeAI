name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vercel Staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-hybridtradeai.vercel.app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Comment deployment URL
        uses: actions/github-script@v7
        with:
          script: |
            console.log('?? Deployed to staging: ${{ steps.deploy.outputs.url }}')

  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Health check
        run: |
          curl -f https://staging-hybridtradeai.vercel.app/api/health || exit 1

      - name: Test authentication endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://staging-hybridtradeai.vercel.app/api/auth/signin)
          if [ $response -eq 200 ] || [ $response -eq 401 ]; then
            echo "Auth endpoint responding"
          else
            echo "Auth endpoint failed with status $response"
            exit 1
          fi
